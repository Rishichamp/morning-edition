name: Daily edition

on:
  schedule:
    - cron: "30 2 * * *"        # 08:00 IST every day (GitHub may start it a little late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test run without Gemini"
        type: boolean
        default: false
      replace:
        description: "Rebuild today's edition even if it exists (sends a new email)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  edition:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r research/requirements.txt
      - name: Research, write and email today's edition
        timeout-minutes: 25
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python research/main.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.replace && '--replace' || '' }}
      - name: Save the edition and knowledge base
        run: |
          git config user.name "morning-edition-bot"
          git config user.email "morning-edition-bot@users.noreply.github.com"
          git add site/data kb
          git diff --cached --quiet || git commit -m "Edition $(TZ=Asia/Kolkata date +%F)"
          git push

  deploy:
    needs: [edition]
    if: always() && (needs.edition.result == 'success' || needs.edition.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: pages
        uses: actions/deploy-pages@v4
