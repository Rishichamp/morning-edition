<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Morning Edition</title>
<meta name="author" content="Rishi Singh">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A private daily newspaper: one edition every morning.">
<script>try{var d=document.documentElement,t=localStorage.getItem("dailyEdition.theme"),m=localStorage.getItem("dailyEdition.motion")||"system";if(t)d.dataset.theme=t;if(m==="off"||(m!=="on"&&matchMedia("(prefers-reduced-motion: reduce)").matches))d.classList.add("reduce")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="css/site.css">
</head>
<body class="page-stage">

<main id="main"></main>

<div class="sticky-bar" id="sticky" role="region" aria-label="Edition actions" hidden></div>
<div class="read-prompt" id="read-prompt" role="dialog" aria-labelledby="rp-t">
  <p id="rp-t">Finished reading? Mark as read?</p>
  <div class="acts"><button class="pill read-btn sm" type="button" id="rp-yes">Mark as read</button><button class="pill ghost sm" type="button" id="rp-no">Not now</button></div>
</div>

<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="js/store.js"></script>
<script src="js/feed.js"></script>
<script src="js/ui.js"></script>
<script src="js/home.js"></script>
<script src="js/edition.js"></script>
<script src="js/deleted.js"></script>
<script src="js/router.js"></script>
</body>
</html>
